<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 380px; margin: 0; padding: 10px; font: 13px/1.4 system-ui, sans-serif; background: #181818; color: #eee; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .item { background: #242424; padding: 8px; border-radius: 6px; margin-bottom: 6px; }
    .name { word-break: break-all; font-weight: 600; margin-bottom: 4px; }
    .meta { color: #999; font-size: 11px; margin-bottom: 6px; }
    .btns { display: flex; gap: 6px; }
    button { background: #333; color: #fff; border: 0; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; }
    button:hover { background: #4a4a4a; }
    .empty { color: #888; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <div class="header">
    <strong>Captured Media</strong>
    <button id="clear">Clear</button>
  </div>
  <div id="list"></div>
  <script src="popup.js"></script>
</body>
</html>
